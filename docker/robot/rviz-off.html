<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RViz is switched off</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
  code { background: #eee; padding: 0 .25rem; }
</style>
</head>
<body>
<h1>RViz is switched off</h1>
<p>The 3D robot view is turned off to save computer power. The demo itself works without it:
the store map on the demo stage shows the robot too.</p>
<p>To turn it on, open the file <code>.env</code> in the demo folder, change <code>HD_RVIZ=no</code>
to <code>HD_RVIZ=yes</code>, and start the demo again.</p>
</body>
</html>
