# PostgreSQL + n8n for the Home Depot guide-robot demo, on this PC.
#   start:  docker compose up -d        stop:  docker compose down
#   wipe the database and n8n (start over):  docker compose down -v
name: homedepot

services:
  postgres:
    image: postgres:16
    container_name: hd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HD_LLM_READER_PASSWORD: ${HD_LLM_READER_PASSWORD}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:5432:5432"          # this PC only
    volumes:
      - hd_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro   # runs once, on an empty database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: hd_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # n8n shares this PC's network, so "localhost" inside n8n is this PC:
    # the robot service is http://localhost:8000 and PostgreSQL is localhost:5432.
    # (A separate Docker network was tried first: this PC's firewall blocks
    # containers from reaching services on the PC itself.)
    network_mode: host
    environment:
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_LISTEN_ADDRESS: 127.0.0.1    # reachable from this PC only
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"       # plain http on localhost
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - hd_n8ndata:/home/node/.n8n

volumes:
  hd_pgdata:
  hd_n8ndata:
